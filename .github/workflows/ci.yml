name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  quality-assurance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run Ruff (Linting & Formatting)
        run: uv run ruff check . && uv run ruff format --check .

      - name: Run Mypy (Static Type Check)
        run: uv run mypy app

      - name: Run Bandit (Security Scan)
        run: uv run bandit -c pyproject.toml -r app

      - name: Run Pytest (Feature Tests)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          BRANCH=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
          case "$BRANCH" in
            feature/summarize)  uv run pytest tests/test_summarize.py -v --tb=short ;;
            feature/classify)   uv run pytest tests/test_classify.py -v --tb=short ;;
            feature/keywords)   uv run pytest tests/test_keywords.py -v --tb=short ;;
            feature/sentiment)  uv run pytest tests/test_sentiment.py -v --tb=short ;;
            feature/qa)         uv run pytest tests/test_qa.py -v --tb=short ;;
            feature/paraphrase) uv run pytest tests/test_paraphrase.py -v --tb=short ;;
            feature/translate)  uv run pytest tests/test_translate.py -v --tb=short ;;
            *)                  uv run pytest tests/ --cov=app --cov-report=term-missing --cov-fail-under=70 ;;
          esac
